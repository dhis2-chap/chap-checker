[project]
name = "chap-checker"
dynamic = ["version"]
description = "Uptime monitoring for DHIS2 with chap-core, chap-core, CAPS, Open Geo Service and any URL; cron-friendly with Slack alerts on status transitions."
readme = "README.md"
authors = [{ name = "Morten Hansen", email = "morten@dhis2.org" }]
license = { text = "AGPL-3.0-or-later" }
requires-python = ">=3.10"
keywords = ["dhis2", "chap", "chap-core", "healthcheck", "uptime", "monitoring", "slack", "cli"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: System Administrators",
  "Programming Language :: Rust",
  "Topic :: System :: Monitoring",
]

[project.urls]
Homepage = "https://github.com/dhis2-chap/chap-checker"
Repository = "https://github.com/dhis2-chap/chap-checker"
Issues = "https://github.com/dhis2-chap/chap-checker/issues"
Documentation = "https://dhis2-chap.github.io/chap-checker/"

# The package is the Rust binary in crates/chap-checker, built by maturin into a wheel per
# platform (`bindings = "bin"`), the way ruff and uv ship. `uvx chap-checker` and
# `uv tool install chap-checker` install it; there is no Python module to import.
[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[tool.maturin]
bindings = "bin"
manifest-path = "crates/chap-checker/Cargo.toml"
strip = true

# Python stays for the docs site and the browser capture script only.
[dependency-groups]
dev = [
  "maturin>=1.9,<2",
  "mkdocs>=1.6.0,<2",              # 2.0 drops the plugin + theme system mkdocs-material needs
  "mkdocs-material>=9.7.7",
  "playwright>=1.63.0",
  "ruff>=0.16.9",
]

[tool.uv]
# The project itself is a compiled binary; `uv sync` installs only the dev tools.
package = false

[tool.ruff]
target-version = "py313"
line-length = 120
