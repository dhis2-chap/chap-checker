site_name: chap-checker
site_description: Health-check CLI for DHIS2 instances integrated with chap-core; cron-friendly with Slack alerts and a TUI dashboard.
site_url: https://dhis2-chap.github.io/chap-checker
repo_url: https://github.com/dhis2-chap/chap-checker
repo_name: dhis2-chap/chap-checker

theme:
  name: material
  palette:
    - scheme: default
      primary: green
      accent: light-green
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: green
      accent: light-green
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate

nav:
  - Home: index.md
  - Guides:
      - Configuration: guides/configuration.md
      - Built-in checks: guides/checks.md
      - Alerting (Slack): guides/alerts.md
      - CLI overview: guides/cli.md
      - Cron deployment: guides/cron.md
      - TUI dashboard: guides/dashboard.md
      - Adding a custom check: guides/custom-checks.md
      - Development: guides/development.md
  - CLI reference: cli-reference.md

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - meta
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink:
      repo_url_shorthand: true
      user: dhis2-chap
      repo: chap-checker
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

plugins:
  - search

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/dhis2-chap/chap-checker
