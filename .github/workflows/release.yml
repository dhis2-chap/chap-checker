name: release

# Cuts a release to PyPI when a `v*` tag is pushed.
#
# chap-checker is a Rust binary; maturin packs it into a wheel per platform
# (`bindings = "bin"` in pyproject.toml), so `uvx chap-checker` and
# `uv tool install chap-checker` keep working with nothing else installed.
#
# Auth uses PyPI's trusted-publishing flow: no API tokens stored on our
# side - PyPI verifies the OIDC token GitHub mints for this specific
# workflow file + environment combination. See docs/guides/releasing.md
# for the operator-side steps (version bump, tag, push).

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check-version:
    name: Tag matches the crate version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Compare the tag with crates/chap-checker/Cargo.toml
        run: |
          tag="${GITHUB_REF_NAME#v}"
          crate="$(grep -E '^version = ' crates/chap-checker/Cargo.toml | head -1 | sed -E 's/.*"(.*)".*/\1/')"
          if [ "$tag" != "$crate" ]; then
            echo "Tag $GITHUB_REF_NAME (-> $tag) does not match the crate version $crate"
            exit 1
          fi

  wheels:
    name: Wheel (${{ matrix.name }})
    needs: check-version
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { name: linux x86_64, runner: ubuntu-latest, target: x86_64-unknown-linux-gnu, manylinux: auto, smoke: true }
          - { name: linux aarch64, runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, manylinux: auto, smoke: true }
          - { name: linux x86_64 musl, runner: ubuntu-latest, target: x86_64-unknown-linux-musl, manylinux: musllinux_1_2, smoke: false }
          - { name: linux aarch64 musl, runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, manylinux: musllinux_1_2, smoke: false }
          - { name: macos x86_64, runner: macos-15-intel, target: x86_64-apple-darwin, manylinux: "", smoke: true }
          - { name: macos arm64, runner: macos-latest, target: aarch64-apple-darwin, manylinux: "", smoke: true }
          - { name: windows x86_64, runner: windows-latest, target: x86_64-pc-windows-msvc, manylinux: "", smoke: false }
    steps:
      - uses: actions/checkout@v7
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --locked --out dist
      - name: Smoke-test the wheel with uvx
        if: matrix.smoke
        shell: bash
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          ~/.local/bin/uvx --no-cache --from dist/*.whl chap-checker --version
      - uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.target }}
          path: dist/*.whl

  sdist:
    name: sdist
    needs: check-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    name: Publish to PyPI (trusted publishing)
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    # Match the environment name configured on PyPI under
    # "trusted publisher" for this project. Gating behind a GitHub
    # Environment also lets you require manual approval per release.
    environment:
      name: pypi
      url: https://pypi.org/project/chap-checker/
    permissions:
      id-token: write   # required for the OIDC token PyPI verifies
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist/
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        # No `password:` here - the action reads the GitHub OIDC
        # token from the runner and exchanges it with PyPI.

  github-release:
    name: Publish GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write   # required to create the release + attach assets
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist/
          merge-multiple: true
      - name: Create release with auto-generated notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # `--generate-notes` lets GitHub build the changelog from
          # merged PRs since the previous tag. `--verify-tag` confirms
          # we're releasing the tag this workflow was triggered for.
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag \
            dist/*.whl dist/*.tar.gz
