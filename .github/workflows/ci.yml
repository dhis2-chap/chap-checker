name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint + type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: make check
        run: make check

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: make test
        run: make test

  # The release ships macOS and Windows wheels too; build and test there on every PR so a
  # platform-only break (signals, file locks, paths) shows up before a tag.
  test-os:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo test
        run: cargo test --locked

  # The release builds a wheel per platform with maturin; build the Linux ones on every PR so a
  # packaging break shows up here, not on the tag.
  wheel:
    name: Wheel (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { name: manylinux x86_64, target: x86_64-unknown-linux-gnu, manylinux: auto }
          - { name: musllinux x86_64, target: x86_64-unknown-linux-musl, manylinux: musllinux_1_2 }
    steps:
      - uses: actions/checkout@v7
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --locked --out dist
      - uses: astral-sh/setup-uv@v10.3.3
      - name: uvx runs the wheel
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: uvx --no-cache --from dist/*.whl chap-checker --version

  docs:
    name: Docs build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - name: Install docs tools
        run: uv sync --frozen
      - name: make docs-build
        run: make docs-build
