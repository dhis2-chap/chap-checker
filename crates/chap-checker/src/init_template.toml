# chap-checker config. Generated by `chap-checker init`.
#
# `chap-checker verify`             - check every instance below
# `chap-checker verify -i <name>`   - check just one
# `chap-checker tui`                - Textual TUI
# `chap-checker serve`              - long-running daemon + browser dashboard (loopback by default)
# `chap-checker checks list`        - every available check name
#
# WARNING: this file may contain credentials. Keep it out of git and
# leave it chmod 600 (which `init` already set on POSIX).

# A working example pointed at the public DHIS2 demo. Replace with your
# own instance once you've confirmed the tool runs.
#
# Optional `name` sets the human label shown in the TUI / dashboard /
# verify table / Slack message. The section key (`play` here) stays the
# stable identifier - state-file dedup keys off it, so renaming `name`
# later doesn't reset the instance's history.
[instances.play]
# name = "DHIS2 demo"
url = "https://play.im.dhis2.org/dev"
username = "admin"
password = "district"
# play.im.dhis2.org doesn't ship the chap-core integration, so scope
# to the vanilla DHIS2 probes. Drop this line to run every check.
checks = ["dhis2_ping", "dhis2_system_info"]

# Prefer pulling secrets from the environment in shared / CI setups:
# [instances.prod]
# url = "https://dhis2.example.com"
# username = "REPLACE_ME"
# password_env = "MY_DHIS2_PASSWORD"
# alerts = ["slack"]               # opt in to the [alerts.slack] section below

# Token-based auth (DHIS2 Personal Access Token). Mutually exclusive
# with password / password_env on the same instance. Sent as
# `Authorization: ApiToken <value>`; `username` is optional in token mode.
# [instances.token-example]
# url = "https://dhis2.example.net"
# token_env = "MY_DHIS2_TOKEN"

# Open Geo Service (openEO backend) deployment. `kind` defaults to
# "dhis2"; set it to "ogs" for OGS servers. OGS has no auth, so there are
# no credential fields, and only the http_2xx / ogs_* checks run.
# [instances.nepal-ogs]
# kind = "ogs"
# name = "Nepal climate service"
# url = "https://ocs-demo-nepal.dhis2.org"

# More kinds (`chap-checker plugins list` shows each with its checks):
#
# chap-core reached directly, by its base URL (its /health and /system/info):
# [instances.chap-stable]
# kind = "chap"
# url = "https://example.org/chap/stable"
#
# CAPS: its version, and whether it reaches chap-core and DHIS2:
# [instances.caps]
# kind = "caps"
# url = "https://example.org/caps"
#
# Any URL, with what it must answer (all optional; the default is any 2xx):
# [instances.landing]
# kind = "http"
# url = "https://example.org/"
# expect_status = [200]
# body_contains = "Welcome"
# json_path = "status"
# json_equals = "success"

# Optional per-instance overrides (shown with their defaults):
# timeout_s = 10.0
# verify_tls = true

# Optional retries on transient transport failures + 429/502/503/504. Off by
# default - a health checker usually wants to see flakes, not mask them. Opt
# in here for the whole config, or per instance via `retry_policy = { ... }`
# inside an [instances.<name>] block. See guides/configuration.md#retries.
# [retry]
# max_attempts = 3
# base_delay = 0.5

# Optional: alert to Slack when a check's status flips between OK and a non-OK
# status. State is persisted to ./chap-checker.state.json (override with
# --state <path>) next to this config. An instance only fires alerts when it
# opts in via `alerts = ["slack"]`.
# [alerts.slack]
# webhook_url_env = "SLACK_WEBHOOK_URL"   # treat the webhook URL as a credential
# notify_on = ["fail", "error", "warn"]   # default
# timeout_s = 10.0                        # default

# Generic webhook alerter: POST the canonical chap-checker JSON envelope to
# any URL that accepts application/json. Run `chap-checker alerts list` for
# the full snippet with per-field comments.
# [alerts.webhook]
# url_env = "MY_WEBHOOK_URL"
# notify_on = ["fail", "error", "warn"]
# headers = { "Authorization" = "Bearer ..." }

# Optional bearer-token auth for `chap-checker serve` ONLY (the HTTP
# daemon). No effect on `verify` or local `tui` - those run in your
# terminal and aren't network-reachable. See docs/guides/serve.md#authentication.
# The token must be non-empty printable ASCII without spaces; an empty or
# unset token_env makes `serve` refuse to start.
# [auth]
# token_env = "CHAP_CHECKER_TOKEN"

# Optional UI branding + theme (shared by the TUI and the browser).
# [ui]
# title = "DHIS2 / Climate Instance Checker"
# theme = "phosphor"   # phosphor | amber | high | tokyo | dhis2
