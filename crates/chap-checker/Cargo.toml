[package]
name = "chap-checker"
version = "1.1.0"
edition = "2024"
description = "Health-check CLI for DHIS2 instances integrated with chap-core, and Open Geo Service deployments."
license = "AGPL-3.0-or-later"
repository = "https://github.com/dhis2-chap/chap-checker"
publish = false

[dependencies]
axum = "0.8.9"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.8", features = ["derive", "env", "wrap_help"] }
clap-markdown = "0.1.5"
comfy-table = "8.0.1"
crossterm = "0.29.0"
futures = "0.3.34"
include_dir = "0.7.4"
indexmap = { version = "2.14.2", features = ["serde"] }
mime_guess = "2.0.5"
rand = "0.10.4"
ratatui = "0.30"
regex = "1.13.1"
reqwest = { version = "0.13.5", features = ["json", "query"] }
rpassword = "7.5.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_path_to_error = "0.1.20"
sokkel-tui = { git = "https://github.com/winterop-com/sokkel-tui", rev = "555b9ae977ccbd6f631f295cee189dfc6ebb9f8b", version = "0.1.0" }
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "sync", "fs", "signal", "net"] }
toml = { version = "1.2.1", features = ["preserve_order"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = { version = "2.5.8", features = ["serde"] }

[dev-dependencies]
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }
wiremock = "0.6.5"

[target."cfg(unix)".dependencies]
libc = "0.2.191"
